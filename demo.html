<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RouteFuel — Commercial Trip & Fuel Stop Optimizer</title>
  
  <!-- Modern Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    #map { width: 100%; height: 100%; min-height: 100%; }

    /* Custom Leaflet stop badge */
    .stop-marker {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #0f172a;
      color: #ffffff;
      padding: 3px 8px 3px 6px;
      border-radius: 9999px;
      border: 1.5px solid #f97316;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .stop-marker:hover {
      transform: scale(1.08);
      border-color: #ea580c;
    }
    .stop-number-badge {
      background: #ea580c;
      color: #ffffff;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
    }

    /* Clean custom popup */
    .leaflet-popup-content-wrapper {
      background: #0f172a !important;
      color: #f8fafc !important;
      border: 1px solid #334155;
      border-radius: 10px !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
      padding: 4px;
    }
    .leaflet-popup-tip {
      background: #0f172a !important;
      border: 1px solid #334155;
    }
    .leaflet-popup-content {
      margin: 10px 12px !important;
      line-height: 1.4 !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden antialiased">

  <!-- Top Navigation Bar -->
  <header class="h-14 bg-slate-900 border-b border-slate-800 px-5 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white text-base shadow-sm">
        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <span class="font-semibold text-slate-100 text-sm tracking-tight">RouteFuel</span>
          <span class="text-[11px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 font-mono">v1.0</span>
        </div>
        <p class="text-[11px] text-slate-400">Long-Haul Highway Routing & Cost Optimizer</p>
      </div>
    </div>

    <div class="flex items-center space-x-4 text-xs text-slate-400">
      <div class="hidden sm:flex items-center space-x-3 border-r border-slate-800 pr-4">
        <span>Max Range: <strong class="text-slate-200">500 mi</strong></span>
        <span>&bull;</span>
        <span>Efficiency: <strong class="text-slate-200">10 MPG</strong></span>
      </div>
      <a href="/api/route/" target="_blank" class="text-slate-400 hover:text-slate-200 text-xs font-medium flex items-center space-x-1 transition">
        <span>Raw API</span>
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
      </a>
    </div>
  </header>

  <!-- Body Content: Sidebar + Map -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- Left Dispatcher Sidebar -->
    <aside class="w-full sm:w-[410px] bg-slate-900 border-r border-slate-800 flex flex-col z-10 shrink-0 overflow-y-auto">
      
      <!-- Inputs & Actions -->
      <div class="p-5 border-b border-slate-800 space-y-4">
        <form id="route-form" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Origin</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <span class="w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-emerald-500/20"></span>
              </span>
              <input type="text" id="start-input" value="New York, NY" required placeholder="City, State or lat, lon"
                     class="w-full bg-slate-950 border border-slate-700/80 rounded-lg pl-8 pr-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Destination</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <span class="w-2 h-2 rounded-full bg-rose-500 ring-2 ring-rose-500/20"></span>
              </span>
              <input type="text" id="finish-input" value="Chicago, IL" required placeholder="City, State or lat, lon"
                     class="w-full bg-slate-950 border border-slate-700/80 rounded-lg pl-8 pr-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition" />
            </div>
          </div>

          <button type="submit" id="submit-btn"
                  class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition flex items-center justify-center space-x-2 shadow-sm">
            <span id="btn-text">Calculate Driving Route</span>
            <svg id="btn-spinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </button>
        </form>

        <!-- Quick Presets -->
        <div>
          <span class="text-[11px] font-medium text-slate-400 block mb-1.5">Sample corridors:</span>
          <div class="flex flex-wrap gap-1.5">
            <button class="preset-btn text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700/80 text-slate-300 border border-slate-700 transition"
                    data-start="New York, NY" data-finish="Chicago, IL">NY → Chicago</button>
            <button class="preset-btn text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700/80 text-slate-300 border border-slate-700 transition"
                    data-start="New York, NY" data-finish="Los Angeles, CA">NY → Los Angeles</button>
            <button class="preset-btn text-xs px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700/80 text-slate-300 border border-slate-700 transition"
                    data-start="New York, NY" data-finish="Philadelphia, PA">Local (&lt;500 mi)</button>
          </div>
        </div>
      </div>

      <!-- Error Message -->
      <div id="error-box" class="hidden m-5 p-3 rounded-lg bg-rose-950/60 border border-rose-800 text-rose-300 text-xs"></div>

      <!-- Results Area -->
      <div id="results-container" class="hidden flex-1 flex flex-col">
        
        <!-- Summary Numbers -->
        <div class="p-5 border-b border-slate-800">
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
              <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wide">Total Distance</span>
              <p id="stat-distance" class="text-lg font-bold text-slate-100 mt-0.5">0 mi</p>
            </div>
            <div class="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
              <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wide">Est. Duration</span>
              <p id="stat-duration" class="text-lg font-bold text-slate-100 mt-0.5">0 hrs</p>
            </div>
            <div class="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
              <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wide">Fuel Stops</span>
              <p id="stat-stops" class="text-lg font-bold text-orange-400 mt-0.5">0</p>
            </div>
            <div class="bg-slate-950/70 p-3 rounded-lg border border-slate-800">
              <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wide">Fuel Expense</span>
              <p id="stat-cost" class="text-lg font-bold text-emerald-400 mt-0.5">$0.00</p>
            </div>
          </div>

          <p id="summary-note" class="text-xs text-slate-400 mt-3 leading-relaxed"></p>
        </div>

        <!-- Planned Fuel Stops List -->
        <div class="flex-1 p-5 overflow-y-auto">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Planned Fuel Stops</span>
            <span id="stops-counter" class="text-[11px] text-slate-400">0 stops</span>
          </div>

          <div id="stops-list" class="space-y-2.5">
            <!-- Dynamic stops -->
          </div>
        </div>

      </div>

    </aside>

    <!-- Right Interactive Map Area -->
    <main class="flex-1 relative bg-slate-950">
      <div id="map"></div>
    </main>

  </div>

  <script>
    // Initialize Leaflet Map
    const map = L.map('map', {
      zoomControl: true
    }).setView([39.8283, -98.5795], 4);

    // High quality, 100% free, watermark-free Esri World Street Map (No API key, no 403 blocks)
    const esriStreets = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, METI, TomTom'
    });

    // Alternative OpenStreetMap Humanitarian layer (No watermark, free)
    const osmHot = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });

    // Default to clean Esri Streets
    esriStreets.addTo(map);

    // Add clean layer switcher
    L.control.layers({
      "Highways & Streets": esriStreets,
      "OpenStreetMap (HOT)": osmHot
    }, null, { position: 'topright' }).addTo(map);

    let routeLayer = null;
    let markersLayer = L.layerGroup().addTo(map);

    const form = document.getElementById('route-form');
    const startInput = document.getElementById('start-input');
    const finishInput = document.getElementById('finish-input');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorBox = document.getElementById('error-box');
    const resultsContainer = document.getElementById('results-container');

    // Preset handlers
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        startInput.value = btn.dataset.start;
        finishInput.value = btn.dataset.finish;
        fetchRoute();
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      fetchRoute();
    });

    async function fetchRoute() {
      const start = startInput.value.trim();
      const finish = finishInput.value.trim();

      if (!start || !finish) return;

      submitBtn.disabled = true;
      btnText.textContent = "Calculating Route...";
      btnSpinner.classList.remove('hidden');
      errorBox.classList.add('hidden');
      errorBox.textContent = "";

      try {
        const response = await fetch('/api/route/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start, finish })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Route planning failed.");
        }

        renderResults(data);

      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
        resultsContainer.classList.add('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = "Calculate Driving Route";
        btnSpinner.classList.add('hidden');
      }
    }

    function renderResults(data) {
      resultsContainer.classList.remove('hidden');

      const s = data.route_summary;
      document.getElementById('stat-distance').textContent = `${s.total_distance_miles.toFixed(1)} mi`;
      document.getElementById('stat-duration').textContent = `${s.total_duration_hours.toFixed(1)} hrs`;
      document.getElementById('stat-stops').textContent = `${s.fuel_stops_count}`;
      document.getElementById('stat-cost').textContent = `$${s.total_fuel_cost_usd.toFixed(2)}`;
      document.getElementById('summary-note').textContent = s.summary_note;
      document.getElementById('stops-counter').textContent = `${s.fuel_stops_count} stop${s.fuel_stops_count === 1 ? '' : 's'}`;

      // Render stops timeline
      const list = document.getElementById('stops-list');
      list.innerHTML = "";

      if (data.fuel_stops.length === 0) {
        list.innerHTML = `
          <div class="p-3 rounded-lg bg-slate-950/50 border border-slate-800 text-slate-400 text-xs text-center">
            No refueling required within vehicle's 500-mile starting tank.
          </div>
        `;
      } else {
        data.fuel_stops.forEach(stop => {
          const item = document.createElement('div');
          item.className = "p-3 rounded-lg bg-slate-950/80 border border-slate-800 hover:border-slate-700 transition cursor-pointer";
          item.onclick = () => {
            map.flyTo([stop.latitude, stop.longitude], 10, { duration: 1.2 });
          };
          item.innerHTML = `
            <div class="flex items-start justify-between">
              <div class="flex items-start space-x-2">
                <span class="mt-0.5 w-4 h-4 rounded-full bg-orange-600 text-white font-bold text-[10px] flex items-center justify-center shrink-0">
                  ${stop.stop_number}
                </span>
                <div>
                  <h4 class="text-xs font-semibold text-slate-100">${stop.station_name}</h4>
                  <p class="text-[11px] text-slate-400 mt-0.5">${stop.city}, ${stop.state}</p>
                  <p class="text-[10px] text-slate-500 mt-0.5 font-mono">Mile ${stop.route_mile} &bull; Leg: ${stop.distance_from_last_stop_miles} mi</p>
                </div>
              </div>
              <div class="text-right">
                <span class="text-xs font-semibold text-emerald-400 font-mono">$${stop.fuel_price_per_gallon.toFixed(3)}/gal</span>
                <p class="text-[10px] text-slate-400 mt-0.5 font-mono">${stop.gallons_refueled} gal &bull; $${stop.leg_fuel_cost_usd.toFixed(2)}</p>
              </div>
            </div>
          `;
          list.appendChild(item);
        });
      }

      // Map Drawing
      if (routeLayer) map.removeLayer(routeLayer);
      markersLayer.clearLayers();

      const latlngs = data.route_geometry.coordinates.map(coord => [coord[1], coord[0]]);

      // Outer outline line
      const outlineLayer = L.polyline(latlngs, {
        color: '#1e3a8a',
        weight: 7,
        opacity: 0.9
      }).addTo(markersLayer);

      // Inner vibrant driving line
      routeLayer = L.polyline(latlngs, {
        color: '#3b82f6',
        weight: 4,
        opacity: 1
      }).addTo(markersLayer);

      map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

      // Start Marker
      const startCoord = latlngs[0];
      L.circleMarker(startCoord, {
        radius: 7,
        fillColor: '#10b981',
        color: '#ffffff',
        weight: 2,
        fillOpacity: 1
      }).bindPopup(`<strong>Origin:</strong> ${data.start}`).addTo(markersLayer);

      // Destination Marker
      const endCoord = latlngs[latlngs.length - 1];
      L.circleMarker(endCoord, {
        radius: 7,
        fillColor: '#ef4444',
        color: '#ffffff',
        weight: 2,
        fillOpacity: 1
      }).bindPopup(`<strong>Destination:</strong> ${data.destination}`).addTo(markersLayer);

      // Selected Fuel Stop Badges on Map
      data.fuel_stops.forEach(stop => {
        const icon = L.divIcon({
          className: '',
          html: `
            <div class="stop-marker">
              <span class="stop-number-badge">${stop.stop_number}</span>
              <span>$${stop.fuel_price_per_gallon.toFixed(2)}</span>
            </div>
          `,
          iconSize: [80, 26],
          iconAnchor: [40, 13]
        });

        const stopMarker = L.marker([stop.latitude, stop.longitude], { icon: icon }).addTo(markersLayer);
        stopMarker.bindPopup(`
          <div style="font-size: 12px; font-family: Inter, sans-serif;">
            <div style="font-size: 11px; text-transform: uppercase; font-weight: 700; color: #f97316; margin-bottom: 2px;">
              Fuel Stop #${stop.stop_number} &bull; Mile ${stop.route_mile}
            </div>
            <strong style="font-size: 13px; color: #ffffff;">${stop.station_name}</strong>
            <div style="color: #94a3b8; font-size: 11px; margin-top: 2px;">
              ${stop.address}<br>${stop.city}, ${stop.state}
            </div>
            <div style="border-top: 1px solid #334155; margin: 8px 0; padding-top: 6px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                <span style="color: #94a3b8;">Fuel Price:</span>
                <strong style="color: #34d399;">$${stop.fuel_price_per_gallon.toFixed(3)}/gal</strong>
              </div>
              <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                <span style="color: #94a3b8;">Fuel Refueled:</span>
                <span style="color: #f1f5f9;">${stop.gallons_refueled} gal</span>
              </div>
              <div style="display: flex; justify-content: space-between;">
                <span style="color: #94a3b8;">Leg Cost:</span>
                <strong style="color: #ffffff;">$${stop.leg_fuel_cost_usd.toFixed(2)}</strong>
              </div>
            </div>
          </div>
        `);
      });
    }

    // Auto-load initial route
    window.addEventListener('DOMContentLoaded', () => {
      fetchRoute();
    });
  </script>
</body>
</html>
