    let isInitialLoad = false;
    const dismissInitialLoader = () => {};

    function initMap() {
      if (typeof L === 'undefined') {
        setTimeout(initMap, 25);
        return;
      }
      map = L.map('map', {
        zoomControl: false,
        zoomAnimation: true,
        fadeAnimation: true,
        markerZoomAnimation: true,
        inertia: true,
        inertiaDeceleration: 3000
      }).setView([39.8283, -98.5795], 4);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      darkTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16,
        attribution: 'Tiles &copy; Esri',
        keepBuffer: 6,
        updateWhenIdle: true
      });

      streetTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        attribution: 'Tiles &copy; Esri',
        keepBuffer: 6,
        updateWhenIdle: true
      });

      darkTiles.addTo(map);
      markersLayer = L.layerGroup().addTo(map);

      setupListeners();
      initApp();
    }

    function setupListeners() {
      const btnDark = document.getElementById('btn-tile-dark');
      const btnStreets = document.getElementById('btn-tile-streets');

      if (btnDark && btnStreets) {
        btnDark.addEventListener('click', () => {
          map.removeLayer(streetTiles);
          darkTiles.addTo(map);
          document.body.classList.remove('streets-mode');
          const tilePane = map.getPane('tilePane');
          if (tilePane) tilePane.classList.remove('streets-night-filter');
          btnDark.className = "px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-white text-black transition";
          btnStreets.className = "px-2.5 py-0.5 rounded-full text-[11px] font-medium text-neutral-400 hover:text-white transition";
        });

        btnStreets.addEventListener('click', () => {
          map.removeLayer(darkTiles);
          streetTiles.addTo(map);
          document.body.classList.add('streets-mode');
          const tilePane = map.getPane('tilePane');
          if (tilePane) tilePane.classList.add('streets-night-filter');
          btnStreets.className = "px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-white text-black transition";
          btnDark.className = "px-2.5 py-0.5 rounded-full text-[11px] font-medium text-neutral-400 hover:text-white transition";
        });
      }
    }

    // DOM Elements
    const form = document.getElementById('route-form');
    const startInput = document.getElementById('start-input');
    const finishInput = document.getElementById('finish-input');
    const swapBtn = document.getElementById('swap-btn');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorBox = document.getElementById('error-box');
    const resultsContainer = document.getElementById('results-container');
    const togglePanelBtn = document.getElementById('toggle-panel-btn');
    const panelContent = document.getElementById('panel-content');
    const toggleIcon = document.getElementById('toggle-icon');
    const copyManifestBtn = document.getElementById('copy-manifest-btn');
    const copyBtnText = document.getElementById('copy-btn-text');
    let currentRouteData = null;

    // Major US Freight & Transit Hubs for Dropdown Menus
    const RELEVANT_HUBS = [
      { name: "New York, NY", region: "Northeast Corridor" },
      { name: "Chicago, IL", region: "Midwest Freight Hub" },
      { name: "Los Angeles, CA", region: "West Coast Gateway" },
      { name: "Dallas, TX", region: "South Central Corridor" },
      { name: "Atlanta, GA", region: "Southeast Distribution" },
      { name: "Houston, TX", region: "Gulf Coast Hub" },
      { name: "Denver, CO", region: "Mountain Corridor" },
      { name: "Philadelphia, PA", region: "Mid-Atlantic Corridor" },
      { name: "Indianapolis, IN", region: "Crossroads of America" },
      { name: "Memphis, TN", region: "Major Logistics Hub" },
      { name: "Kansas City, MO", region: "Central Freight Hub" },
      { name: "Phoenix, AZ", region: "Southwest Corridor" },
      { name: "Seattle, WA", region: "Pacific Northwest" },
      { name: "Miami, FL", region: "South Florida Hub" }
    ];

    // Dropdown DOM Elements
    const startWrapper = document.getElementById('start-wrapper');
    const startDropdown = document.getElementById('start-dropdown');
    const startDropdownList = document.getElementById('start-dropdown-list');
    const startChevronBtn = document.getElementById('start-chevron-btn');
    const startChevronIcon = document.getElementById('start-chevron-icon');

    const finishWrapper = document.getElementById('finish-wrapper');
    const finishDropdown = document.getElementById('finish-dropdown');
    const finishDropdownList = document.getElementById('finish-dropdown-list');
    const finishChevronBtn = document.getElementById('finish-chevron-btn');
    const finishChevronIcon = document.getElementById('finish-chevron-icon');

    function populateDropdown(listEl, items, inputEl, dropdownEl, chevronIcon) {
      listEl.innerHTML = "";
      if (items.length === 0) {
        listEl.innerHTML = `<div class="px-3 py-2 text-xs text-neutral-500 text-center">No matching freight hubs</div>`;
        return;
      }
      items.forEach(hub => {
        const item = document.createElement('button');
        item.type = "button";
        item.className = "w-full text-left px-2.5 py-1.5 rounded-xl hover:bg-white/10 flex items-center justify-between transition-colors group";
        item.innerHTML = `
          <span class="text-xs font-medium text-neutral-200 group-hover:text-white transition-colors">${hub.name}</span>
          <span class="text-[10px] text-neutral-500 group-hover:text-amber-400 font-mono transition-colors">${hub.region}</span>
        `;
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          inputEl.value = hub.name;
          closeDropdown(dropdownEl, chevronIcon);
          inputEl.focus();
        });
        listEl.appendChild(item);
      });
    }

    function openDropdown(dropdownEl, chevronIcon, listEl, inputEl) {
      if (dropdownEl === startDropdown) {
        closeDropdown(finishDropdown, finishChevronIcon);
      } else {
        closeDropdown(startDropdown, startChevronIcon);
      }
      populateDropdown(listEl, filterHubs(inputEl.value), inputEl, dropdownEl, chevronIcon);
      dropdownEl.classList.remove('hidden');
      chevronIcon.classList.add('rotate-180');
    }

    function closeDropdown(dropdownEl, chevronIcon) {
      if (dropdownEl) dropdownEl.classList.add('hidden');
      if (chevronIcon) chevronIcon.classList.remove('rotate-180');
    }

    function filterHubs(query) {
      if (!query || query.trim() === "") return RELEVANT_HUBS;
      const q = query.toLowerCase().trim();
      const filtered = RELEVANT_HUBS.filter(h => h.name.toLowerCase().includes(q) || h.region.toLowerCase().includes(q));
      return filtered.length > 0 ? filtered : RELEVANT_HUBS;
    }

    // Bind Origin Dropdown Triggers
    startChevronBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = !startDropdown.classList.contains('hidden');
      if (isOpen) {
        closeDropdown(startDropdown, startChevronIcon);
      } else {
        openDropdown(startDropdown, startChevronIcon, startDropdownList, startInput);
      }
    });

    startInput.addEventListener('focus', () => {
      openDropdown(startDropdown, startChevronIcon, startDropdownList, startInput);
    });

    startInput.addEventListener('input', () => {
      populateDropdown(startDropdownList, filterHubs(startInput.value), startInput, startDropdown, startChevronIcon);
      startDropdown.classList.remove('hidden');
      startChevronIcon.classList.add('rotate-180');
    });

    // Bind Destination Dropdown Triggers
    finishChevronBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = !finishDropdown.classList.contains('hidden');
      if (isOpen) {
        closeDropdown(finishDropdown, finishChevronIcon);
      } else {
        openDropdown(finishDropdown, finishChevronIcon, finishDropdownList, finishInput);
      }
    });

    finishInput.addEventListener('focus', () => {
      openDropdown(finishDropdown, finishChevronIcon, finishDropdownList, finishInput);
    });

    finishInput.addEventListener('input', () => {
      populateDropdown(finishDropdownList, filterHubs(finishInput.value), finishInput, finishDropdown, finishChevronIcon);
      finishDropdown.classList.remove('hidden');
      finishChevronIcon.classList.add('rotate-180');
    });

    // Close dropdowns on outside click or Escape
    document.addEventListener('click', (e) => {
      if (!startWrapper.contains(e.target)) closeDropdown(startDropdown, startChevronIcon);
      if (!finishWrapper.contains(e.target)) closeDropdown(finishDropdown, finishChevronIcon);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeDropdown(startDropdown, startChevronIcon);
        closeDropdown(finishDropdown, finishChevronIcon);
      }
    });

    // Panel collapse toggle with silky smooth height animation
    let isCollapsed = false;
    togglePanelBtn.addEventListener('click', () => {
      isCollapsed = !isCollapsed;
      if (isCollapsed) {
        panelContent.style.maxHeight = '0px';
        panelContent.style.opacity = '0';
        panelContent.style.paddingTop = '0px';
        panelContent.style.paddingBottom = '0px';
        panelContent.style.overflow = 'hidden';
        toggleIcon.classList.add('rotate-180');
      } else {
        panelContent.style.maxHeight = 'calc(100vh - 6rem)';
        panelContent.style.opacity = '1';
        panelContent.style.paddingTop = '1.25rem';
        panelContent.style.paddingBottom = '1.25rem';
        panelContent.style.overflow = 'auto';
        toggleIcon.classList.remove('rotate-180');
      }
    });

    // Tactile counter smoothening (Apple ease-out cubic)
    function animateCount(elementId, targetValue, duration, formatter) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const startTime = performance.now();
      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        const val = targetValue * ease;
        el.textContent = formatter(val);
        if (progress < 1) {
          requestAnimationFrame(update);
        } else {
          el.textContent = formatter(targetValue);
        }
      }
      requestAnimationFrame(update);
    }

    // Swap origin & destination
    swapBtn.addEventListener('click', () => {
      const temp = startInput.value;
      startInput.value = finishInput.value;
      finishInput.value = temp;
      fetchRoute();
    });

    // Preset button handlers
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        startInput.value = btn.dataset.start;
        finishInput.value = btn.dataset.finish;
        fetchRoute();
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      fetchRoute();
    });

    // Driver dispatch manifest clipboard exporter
    copyManifestBtn.addEventListener('click', () => {
      if (!currentRouteData) return;
      const s = currentRouteData.route_summary;
      let text = `ROUTEFUEL DRIVER TRIP MANIFEST\n`;
      text += `Origin: ${currentRouteData.start}\n`;
      text += `Destination: ${currentRouteData.destination}\n`;
      text += `Total Distance: ${s.total_distance_miles.toFixed(1)} mi | Est. Drive: ${s.total_duration_hours.toFixed(1)} hrs\n`;
      text += `Total Fuel Cost: $${s.total_fuel_cost_usd.toFixed(2)} | Fuel Stops: ${s.fuel_stops_count}\n`;
      text += `Vehicle Spec: 500 mi tank range, 10 MPG Fleet Spec\n\n`;

      if (currentRouteData.fuel_stops.length === 0) {
        text += `No refueling required. Initial 500-mile tank is sufficient.\n`;
      } else {
        text += `PLANNED REFUEL STOPS:\n`;
        currentRouteData.fuel_stops.forEach(stop => {
          text += `Stop #${stop.stop_number}: ${stop.station_name}\n`;
          text += `  Location: ${stop.address}, ${stop.city}, ${stop.state} (Mile ${stop.route_mile})\n`;
          text += `  Leg Distance: ${stop.distance_from_last_stop_miles} mi\n`;
          text += `  Refuel: ${stop.gallons_refueled} gal @ $${stop.fuel_price_per_gallon.toFixed(3)}/gal ($${stop.leg_fuel_cost_usd.toFixed(2)})\n\n`;
        });
      }

      navigator.clipboard.writeText(text).then(() => {
        copyBtnText.textContent = "✓ Manifest Copied!";
        copyManifestBtn.classList.add('text-amber-400');
        setTimeout(() => {
          copyBtnText.textContent = "Copy Trip Manifest";
          copyManifestBtn.classList.remove('text-amber-400');
        }, 2200);
      }).catch(() => {
        copyBtnText.textContent = "Manifest Ready";
      });
    });

    async function fetchRoute() {
      const start = startInput.value.trim();
      const finish = finishInput.value.trim();

      if (!start || !finish) return;

      submitBtn.disabled = true;
      btnText.textContent = "Computing...";
      btnSpinner.classList.remove('hidden');
      errorBox.classList.add('hidden');
      errorBox.textContent = "";

      try {
        const response = await fetch('/api/route/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start, finish })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Route planning failed.");
        }

        renderResults(data);

      } catch (err) {
        if (isInitialLoad) {
          isInitialLoad = false;
          dismissInitialLoader();
        }
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
        resultsContainer.classList.add('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = "Optimize Route";
        btnSpinner.classList.add('hidden');
      }
    }

    function renderResults(data) {
      currentRouteData = data;
      resultsContainer.classList.remove('hidden');
      resultsContainer.classList.remove('animate-glass-reveal');
      void resultsContainer.offsetWidth; // trigger reflow for smooth re-animation
      resultsContainer.classList.add('animate-glass-reveal');

      const s = data.route_summary;
      animateCount('stat-distance', s.total_distance_miles, 650, v => `${v.toFixed(1)} mi`);
      animateCount('stat-duration', s.total_duration_hours, 650, v => `${v.toFixed(1)} hrs`);
      animateCount('stat-stops', s.fuel_stops_count, 500, v => `${Math.round(v)}`);
      animateCount('stat-cost', s.total_fuel_cost_usd, 750, v => `$${v.toFixed(2)}`);
      document.getElementById('summary-note').textContent = s.summary_note;
      document.getElementById('stops-counter').textContent = `${s.fuel_stops_count} stop${s.fuel_stops_count === 1 ? '' : 's'}`;

      // Render stops list
      const list = document.getElementById('stops-list');
      list.innerHTML = "";

      if (data.fuel_stops.length === 0) {
        list.innerHTML = `
          <div class="p-3 rounded-2xl liquid-glass-card text-neutral-400 text-xs text-center animate-glass-reveal">
            No fuel stops required. Starting 500-mile tank is sufficient.
          </div>
        `;
      } else {
        data.fuel_stops.forEach((stop, index) => {
          const item = document.createElement('div');
          item.className = "liquid-glass-card p-3 rounded-2xl cursor-pointer flex items-center justify-between";
          item.style.animation = "glassReveal 0.4s cubic-bezier(0.16, 1, 0.3, 1) both";
          item.style.animationDelay = `${index * 55}ms`;
          item.onclick = () => {
            map.flyTo([stop.latitude, stop.longitude], 11, { duration: 1.4, easeLinearity: 0.25 });
          };
          item.innerHTML = `
            <div class="flex items-start space-x-2.5">
              <span class="mt-0.5 w-5 h-5 rounded-full bg-amber-400 text-black font-bold text-[10px] flex items-center justify-center shrink-0">
                ${stop.stop_number}
              </span>
              <div>
                <h3 class="text-xs font-semibold text-white">${stop.station_name}</h3>
                <p class="text-[11px] text-neutral-300">${stop.city}, ${stop.state}</p>
                <p class="text-[10px] text-neutral-400 mt-0.5 font-mono">Mile ${stop.route_mile} &bull; Leg: ${stop.distance_from_last_stop_miles} mi</p>
              </div>
            </div>
            <div class="text-right">
              <span class="text-xs font-semibold text-amber-400 font-mono">$${stop.fuel_price_per_gallon.toFixed(3)}/gal</span>
              <p class="text-[10px] text-neutral-300 mt-0.5 font-mono">${stop.gallons_refueled} gal = <strong class="text-white">$${stop.leg_fuel_cost_usd.toFixed(2)}</strong></p>
            </div>
          `;
          list.appendChild(item);
        });
      }

      // Clear existing layers
      if (routeLayer) map.removeLayer(routeLayer);
      if (outlineLayer) map.removeLayer(outlineLayer);
      markersLayer.clearLayers();

      const latlngs = data.route_geometry.coordinates.map(coord => [coord[1], coord[0]]);

      // Outer glow polyline
      outlineLayer = L.polyline(latlngs, {
        color: '#000000',
        weight: 7,
        opacity: 0.6
      }).addTo(markersLayer);

      // Core electric highway polyline (Apple Maps electric blue with soft glow)
      routeLayer = L.polyline(latlngs, {
        color: '#38bdf8',
        weight: 4,
        opacity: 0.95,
        className: 'route-glow'
      }).addTo(markersLayer);

      map.fitBounds(routeLayer.getBounds(), {
        paddingTopLeft: [420, 50],
        paddingBottomRight: [50, 50],
        animate: !isInitialLoad,
        duration: isInitialLoad ? 0 : 1.2,
        easeLinearity: 0.25
      });

      // Start Marker (White with black core)
      const startCoord = latlngs[0];
      L.circleMarker(startCoord, {
        radius: 6,
        fillColor: '#ffffff',
        color: '#000000',
        weight: 2.5,
        fillOpacity: 1
      }).bindPopup(`<strong>Origin:</strong> ${data.start}`).addTo(markersLayer);

      // Destination Marker (Amber core with white ring)
      const endCoord = latlngs[latlngs.length - 1];
      L.circleMarker(endCoord, {
        radius: 6,
        fillColor: '#f59e0b',
        color: '#ffffff',
        weight: 2,
        fillOpacity: 1
      }).bindPopup(`<strong>Destination:</strong> ${data.destination}`).addTo(markersLayer);

      // Fuel Stop Pill Markers on Map
      data.fuel_stops.forEach(stop => {
        const icon = L.divIcon({
          className: '',
          html: `
            <div class="map-stop-pill">
              <span class="map-stop-badge">${stop.stop_number}</span>
              <span>$${stop.fuel_price_per_gallon.toFixed(2)}</span>
            </div>
          `,
          iconSize: [84, 28],
          iconAnchor: [42, 14]
        });

        const stopMarker = L.marker([stop.latitude, stop.longitude], { icon: icon }).addTo(markersLayer);
        stopMarker.on('click', () => {
          map.flyTo([stop.latitude, stop.longitude], 11, { duration: 1.2, easeLinearity: 0.25 });
        });
        stopMarker.bindPopup(`
          <div style="font-size: 12px; font-family: var(--font-stack);">
            <div style="font-size: 10px; text-transform: uppercase; font-weight: 700; color: #f59e0b; margin-bottom: 2px;">
              Fuel Stop #${stop.stop_number} &bull; Mile ${stop.route_mile}
            </div>
            <strong style="font-size: 13px; color: #ffffff;">${stop.station_name}</strong>
            <div style="color: #a1a1aa; font-size: 11px; margin-top: 2px;">
              ${stop.address}<br>${stop.city}, ${stop.state}
            </div>
            <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 8px 0; padding-top: 6px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                <span style="color: #a1a1aa;">Price:</span>
                <strong style="color: #fbbf24;">$${stop.fuel_price_per_gallon.toFixed(3)}/gal</strong>
              </div>
              <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                <span style="color: #a1a1aa;">Refueled:</span>
                <span style="color: #ffffff;">${stop.gallons_refueled} gal</span>
              </div>
              <div style="display: flex; justify-content: space-between;">
                <span style="color: #a1a1aa;">Leg Cost:</span>
                <strong style="color: #ffffff;">$${stop.leg_fuel_cost_usd.toFixed(2)}</strong>
              </div>
            </div>
          </div>
        `);
      });

      map.invalidateSize();
    }

    function initApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const startParam = urlParams.get('start');
      const finishParam = urlParams.get('finish');
      if (startParam) startInput.value = startParam;
      if (finishParam) finishInput.value = finishParam;
      fetchRoute();
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initMap);
    } else {
      initMap();
    }
  </script>
</body>
</html>
