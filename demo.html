<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RouteFuel: Commercial Route and Fuel Optimizer</title>
  
  <!-- Apple Native System Typography (SF Pro) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS and JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /*
     * Design System: Apple Liquid Glass Web Approximation
     * Adheres strictly to design-taste-frontend directives.
     * Palette: True monochrome (black, white, gray) with singular amber accent.
     * Typography: Apple SF Pro native system font stack with tabular figures.
     * Zero em-dashes anywhere in markup or copy.
     */

    :root {
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", "Plus Jakarta Sans", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-stack);
      letter-spacing: -0.015em;
    }

    /* Edge-to-edge living background map */
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Apple Liquid Glass web approximation (Appendix C skeleton) */
    .liquid-glass-island {
      position: relative;
      isolation: isolate;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)),
        rgba(10, 10, 10, 0.72);
      backdrop-filter: blur(32px) saturate(180%) contrast(1.05);
      -webkit-backdrop-filter: blur(32px) saturate(180%) contrast(1.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 -1px 0 rgba(255, 255, 255, 0.05),
        0 24px 60px -12px rgba(0, 0, 0, 0.85);
    }

    /* Frosted glass internal cards */
    .liquid-glass-card {
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease, border-color 0.2s ease;
    }
    .liquid-glass-card:hover {
      background: rgba(255, 255, 255, 0.065);
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    /* Minimalist tactile chips */
    .glass-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      transition: all 0.18s ease;
    }
    .glass-chip:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Outlined clean input with focus ring */
    .glass-input {
      background: rgba(18, 18, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.09);
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .glass-input:focus {
      background: rgba(24, 24, 27, 0.95);
      border-color: rgba(255, 255, 255, 0.38);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
    }

    /* Map fuel stop markers */
    .map-stop-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(12, 12, 14, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #ffffff;
      padding: 3.5px 9px 3.5px 5px;
      border-radius: 9999px;
      border: 1px solid rgba(245, 158, 11, 0.65);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .map-stop-pill:hover {
      transform: scale(1.08);
      border-color: #fbbf24;
    }
    .map-stop-badge {
      background: #f59e0b;
      color: #09090b;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
    }

    /* Leaflet popup styling */
    .leaflet-popup-content-wrapper {
      background: rgba(12, 12, 14, 0.96) !important;
      backdrop-filter: blur(24px) !important;
      -webkit-backdrop-filter: blur(24px) !important;
      color: #f4f4f5 !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 16px !important;
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.8) !important;
      padding: 4px;
    }
    .leaflet-popup-tip {
      background: rgba(12, 12, 14, 0.96) !important;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .leaflet-popup-content {
      margin: 12px 14px !important;
      line-height: 1.45 !important;
    }

    /* Accessibility: Reduced motion & transparency fallbacks */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
    @media (prefers-reduced-transparency: reduce) {
      .liquid-glass-island, .liquid-glass-card {
        background: #09090b !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
    }

    /* Clean thin scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.22);
    }
  </style>
</head>
<body class="bg-black text-neutral-100 h-screen w-screen overflow-hidden antialiased select-none">

  <!-- Fullscreen Living Map Canvas -->
  <div id="map"></div>

  <!-- Top-Right Floating Controls (Layer Switcher & Vehicle Specs) -->
  <div class="fixed top-5 right-5 z-[500] flex items-center space-x-2 pointer-events-auto">
    <!-- Map Style Toggle Pill -->
    <div class="liquid-glass-island px-3 py-1.5 rounded-full flex items-center space-x-1.5 text-xs text-neutral-300">
      <span class="text-neutral-400 text-[11px] font-medium">Map:</span>
      <button id="btn-tile-dark" class="px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-white text-black transition">Dark</button>
      <button id="btn-tile-streets" class="px-2.5 py-0.5 rounded-full text-[11px] font-medium text-neutral-400 hover:text-white transition">Streets</button>
    </div>

    <!-- Vehicle Specs Pill -->
    <div class="hidden sm:flex liquid-glass-island px-3.5 py-1.5 rounded-full items-center space-x-2 text-xs text-neutral-300">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
      <span class="text-[11px] text-neutral-300 font-medium">500 mi Range</span>
      <span class="text-neutral-600">&bull;</span>
      <span class="text-[11px] text-neutral-300 font-medium">10 MPG</span>
    </div>
  </div>

  <!-- Floating Island: Main Dispatcher Glass Panel -->
  <aside id="main-panel"
         class="fixed top-5 left-5 z-[500] w-[calc(100vw-2.5rem)] sm:w-[395px] max-h-[calc(100vh-2.5rem)] liquid-glass-island rounded-3xl flex flex-col pointer-events-auto transition-all duration-300 overflow-hidden">

    <!-- Island Header: Clean Typography Only (No Icon) -->
    <div class="px-5 py-4 border-b border-white/[0.08] flex items-center justify-between shrink-0">
      <div class="flex items-center space-x-2">
        <h1 class="text-sm font-semibold tracking-tight text-white">RouteFuel</h1>
      </div>

      <!-- Minimize / Expand Toggle -->
      <button id="toggle-panel-btn" title="Toggle panel"
              class="w-7 h-7 rounded-full glass-chip flex items-center justify-center text-neutral-400 hover:text-white transition">
        <svg id="toggle-icon" class="w-3.5 h-3.5 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>

    <!-- Scrollable Panel Body -->
    <div id="panel-content" class="flex-1 overflow-y-auto custom-scroll p-5 space-y-4">

      <!-- Route Inputs -->
      <form id="route-form" class="space-y-3">
        <div class="relative space-y-2">
          
          <!-- Origin Field -->
          <div class="relative">
            <label class="block text-[11px] font-medium text-neutral-400 mb-1 pl-1">Origin</label>
            <div class="relative flex items-center">
              <span class="absolute left-3 w-1.5 h-1.5 rounded-full bg-white ring-4 ring-white/10"></span>
              <input type="text" id="start-input" value="New York, NY" required placeholder="Start city, state"
                     class="w-full glass-input text-white text-xs sm:text-sm rounded-xl pl-8 pr-3 py-2.5 focus:outline-none" />
            </div>
          </div>

          <!-- Swap Button -->
          <button type="button" id="swap-btn" title="Swap locations"
                  class="absolute right-3 top-[32px] z-10 w-6 h-6 rounded-full bg-neutral-900 border border-white/10 hover:border-white/20 flex items-center justify-center text-neutral-400 hover:text-white transition active:scale-95">
            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
            </svg>
          </button>

          <!-- Destination Field -->
          <div class="relative">
            <label class="block text-[11px] font-medium text-neutral-400 mb-1 pl-1">Destination</label>
            <div class="relative flex items-center">
              <span class="absolute left-3 w-1.5 h-1.5 rounded-full bg-amber-400 ring-4 ring-amber-400/10"></span>
              <input type="text" id="finish-input" value="Chicago, IL" required placeholder="Destination city, state"
                     class="w-full glass-input text-white text-xs sm:text-sm rounded-xl pl-8 pr-3 py-2.5 focus:outline-none" />
            </div>
          </div>
        </div>

        <!-- Apple-Style White Action Button -->
        <button type="submit" id="submit-btn"
                class="w-full mt-2 bg-white hover:bg-neutral-200 active:scale-[0.98] text-black font-semibold py-2.5 rounded-xl text-xs sm:text-sm transition-all shadow-md flex items-center justify-center space-x-2">
          <span id="btn-text">Optimize Route</span>
          <svg id="btn-spinner" class="hidden animate-spin h-3.5 w-3.5 text-black" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </form>

      <!-- Preset Chips -->
      <div>
        <div class="flex items-center space-x-1.5 overflow-x-auto pb-1 custom-scroll">
          <button class="preset-btn glass-chip px-2.5 py-1 rounded-full text-[11px] font-medium text-neutral-300 shrink-0"
                  data-start="New York, NY" data-finish="Chicago, IL">NY to Chicago</button>
          <button class="preset-btn glass-chip px-2.5 py-1 rounded-full text-[11px] font-medium text-neutral-300 shrink-0"
                  data-start="New York, NY" data-finish="Los Angeles, CA">Cross-Country</button>
          <button class="preset-btn glass-chip px-2.5 py-1 rounded-full text-[11px] font-medium text-neutral-300 shrink-0"
                  data-start="New York, NY" data-finish="Philadelphia, PA">Short (&lt;500 mi)</button>
        </div>
      </div>

      <!-- Error Notice -->
      <div id="error-box" class="hidden p-3 rounded-xl bg-neutral-900 border border-rose-500/30 text-rose-300 text-xs leading-relaxed"></div>

      <!-- Dynamic Route Results -->
      <div id="results-container" class="hidden space-y-3.5 pt-1">
        
        <!-- Metrics Grid (Monochrome Glass with Amber Accent) -->
        <div class="grid grid-cols-2 gap-2">
          <div class="liquid-glass-card p-2.5 rounded-2xl">
            <span class="text-[10px] font-medium text-neutral-400 uppercase tracking-wider block">Total Distance</span>
            <span id="stat-distance" class="text-base sm:text-lg font-bold text-white tracking-tight mt-0.5 block tabular-nums">0 mi</span>
          </div>
          <div class="liquid-glass-card p-2.5 rounded-2xl">
            <span class="text-[10px] font-medium text-neutral-400 uppercase tracking-wider block">Est. Drive Time</span>
            <span id="stat-duration" class="text-base sm:text-lg font-bold text-white tracking-tight mt-0.5 block tabular-nums">0 hrs</span>
          </div>
          <div class="liquid-glass-card p-2.5 rounded-2xl">
            <span class="text-[10px] font-medium text-neutral-400 uppercase tracking-wider block">Fuel Stops</span>
            <span id="stat-stops" class="text-base sm:text-lg font-bold text-amber-400 tracking-tight mt-0.5 block tabular-nums">0</span>
          </div>
          <div class="liquid-glass-card p-2.5 rounded-2xl">
            <span class="text-[10px] font-medium text-neutral-400 uppercase tracking-wider block">Total Fuel Cost</span>
            <span id="stat-cost" class="text-base sm:text-lg font-bold text-white tracking-tight mt-0.5 block tabular-nums">$0.00</span>
          </div>
        </div>

        <!-- Strategy Note -->
        <div id="summary-note" class="text-[11px] text-neutral-400 liquid-glass-card p-3 rounded-xl leading-relaxed"></div>

        <!-- Stops Timeline -->
        <div>
          <div class="flex items-center justify-between mb-2 px-1">
            <span class="text-[11px] font-semibold text-neutral-300 uppercase tracking-wider">Planned Fuel Stops</span>
            <span id="stops-counter" class="text-[10px] text-neutral-500 font-mono">0 stops</span>
          </div>

          <div id="stops-list" class="space-y-2">
            <!-- Rendered dynamically -->
          </div>
        </div>

      </div>

    </div>

  </aside>

  <script>
    // Initialize Map with dark background default
    const map = L.map('map', {
      zoomControl: false
    }).setView([39.8283, -98.5795], 4);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // 1. Watermark-free Esri Dark Gray Canvas (Default)
    const darkTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16,
      attribution: 'Tiles &copy; Esri'
    });

    // 2. Watermark-free Esri World Street Map (Alternative)
    const streetTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    });

    darkTiles.addTo(map);

    // Layer switcher toggle handlers
    const btnDark = document.getElementById('btn-tile-dark');
    const btnStreets = document.getElementById('btn-tile-streets');

    btnDark.addEventListener('click', () => {
      map.removeLayer(streetTiles);
      darkTiles.addTo(map);
      btnDark.className = "px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-white text-black transition";
      btnStreets.className = "px-2.5 py-0.5 rounded-full text-[11px] font-medium text-neutral-400 hover:text-white transition";
    });

    btnStreets.addEventListener('click', () => {
      map.removeLayer(darkTiles);
      streetTiles.addTo(map);
      btnStreets.className = "px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-white text-black transition";
      btnDark.className = "px-2.5 py-0.5 rounded-full text-[11px] font-medium text-neutral-400 hover:text-white transition";
    });

    let routeLayer = null;
    let outlineLayer = null;
    let markersLayer = L.layerGroup().addTo(map);

    // DOM Elements
    const form = document.getElementById('route-form');
    const startInput = document.getElementById('start-input');
    const finishInput = document.getElementById('finish-input');
    const swapBtn = document.getElementById('swap-btn');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorBox = document.getElementById('error-box');
    const resultsContainer = document.getElementById('results-container');
    const togglePanelBtn = document.getElementById('toggle-panel-btn');
    const panelContent = document.getElementById('panel-content');
    const toggleIcon = document.getElementById('toggle-icon');

    // Panel collapse toggle for mobile/fullscreen map view
    let isCollapsed = false;
    togglePanelBtn.addEventListener('click', () => {
      isCollapsed = !isCollapsed;
      if (isCollapsed) {
        panelContent.classList.add('hidden');
        toggleIcon.classList.add('rotate-180');
      } else {
        panelContent.classList.remove('hidden');
        toggleIcon.classList.remove('rotate-180');
      }
    });

    // Swap origin & destination
    swapBtn.addEventListener('click', () => {
      const temp = startInput.value;
      startInput.value = finishInput.value;
      finishInput.value = temp;
      fetchRoute();
    });

    // Preset button handlers
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        startInput.value = btn.dataset.start;
        finishInput.value = btn.dataset.finish;
        fetchRoute();
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      fetchRoute();
    });

    async function fetchRoute() {
      const start = startInput.value.trim();
      const finish = finishInput.value.trim();

      if (!start || !finish) return;

      submitBtn.disabled = true;
      btnText.textContent = "Computing...";
      btnSpinner.classList.remove('hidden');
      errorBox.classList.add('hidden');
      errorBox.textContent = "";

      try {
        const response = await fetch('/api/route/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start, finish })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Route planning failed.");
        }

        renderResults(data);

      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('hidden');
        resultsContainer.classList.add('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = "Optimize Route";
        btnSpinner.classList.add('hidden');
      }
    }

    function renderResults(data) {
      resultsContainer.classList.remove('hidden');

      const s = data.route_summary;
      document.getElementById('stat-distance').textContent = `${s.total_distance_miles.toFixed(1)} mi`;
      document.getElementById('stat-duration').textContent = `${s.total_duration_hours.toFixed(1)} hrs`;
      document.getElementById('stat-stops').textContent = `${s.fuel_stops_count}`;
      document.getElementById('stat-cost').textContent = `$${s.total_fuel_cost_usd.toFixed(2)}`;
      document.getElementById('summary-note').textContent = s.summary_note;
      document.getElementById('stops-counter').textContent = `${s.fuel_stops_count} stop${s.fuel_stops_count === 1 ? '' : 's'}`;

      // Render stops list
      const list = document.getElementById('stops-list');
      list.innerHTML = "";

      if (data.fuel_stops.length === 0) {
        list.innerHTML = `
          <div class="p-3 rounded-2xl liquid-glass-card text-neutral-400 text-xs text-center">
            No fuel stops required. Starting 500-mile tank is sufficient.
          </div>
        `;
      } else {
        data.fuel_stops.forEach(stop => {
          const item = document.createElement('div');
          item.className = "liquid-glass-card p-3 rounded-2xl cursor-pointer flex items-center justify-between";
          item.onclick = () => {
            map.flyTo([stop.latitude, stop.longitude], 10, { duration: 1.2 });
          };
          item.innerHTML = `
            <div class="flex items-start space-x-2.5">
              <span class="mt-0.5 w-5 h-5 rounded-full bg-amber-400 text-black font-bold text-[10px] flex items-center justify-center shrink-0">
                ${stop.stop_number}
              </span>
              <div>
                <h4 class="text-xs font-semibold text-white">${stop.station_name}</h4>
                <p class="text-[11px] text-neutral-400">${stop.city}, ${stop.state}</p>
                <p class="text-[10px] text-neutral-500 mt-0.5 font-mono">Mile ${stop.route_mile} &bull; Leg: ${stop.distance_from_last_stop_miles} mi</p>
              </div>
            </div>
            <div class="text-right">
              <span class="text-xs font-semibold text-amber-400 font-mono">$${stop.fuel_price_per_gallon.toFixed(3)}/gal</span>
              <p class="text-[10px] text-neutral-400 mt-0.5 font-mono">${stop.gallons_refueled} gal = <strong class="text-white">$${stop.leg_fuel_cost_usd.toFixed(2)}</strong></p>
            </div>
          `;
          list.appendChild(item);
        });
      }

      // Clear existing layers
      if (routeLayer) map.removeLayer(routeLayer);
      if (outlineLayer) map.removeLayer(outlineLayer);
      markersLayer.clearLayers();

      const latlngs = data.route_geometry.coordinates.map(coord => [coord[1], coord[0]]);

      // Outer glow polyline
      outlineLayer = L.polyline(latlngs, {
        color: '#000000',
        weight: 7,
        opacity: 0.6
      }).addTo(markersLayer);

      // Core electric highway polyline (Apple Maps electric blue)
      routeLayer = L.polyline(latlngs, {
        color: '#38bdf8',
        weight: 4,
        opacity: 1
      }).addTo(markersLayer);

      map.fitBounds(routeLayer.getBounds(), {
        paddingTopLeft: [420, 50],
        paddingBottomRight: [50, 50]
      });

      // Start Marker (White with black core)
      const startCoord = latlngs[0];
      L.circleMarker(startCoord, {
        radius: 6,
        fillColor: '#ffffff',
        color: '#000000',
        weight: 2.5,
        fillOpacity: 1
      }).bindPopup(`<strong>Origin:</strong> ${data.start}`).addTo(markersLayer);

      // Destination Marker (Amber core with white ring)
      const endCoord = latlngs[latlngs.length - 1];
      L.circleMarker(endCoord, {
        radius: 6,
        fillColor: '#f59e0b',
        color: '#ffffff',
        weight: 2,
        fillOpacity: 1
      }).bindPopup(`<strong>Destination:</strong> ${data.destination}`).addTo(markersLayer);

      // Fuel Stop Pill Markers on Map
      data.fuel_stops.forEach(stop => {
        const icon = L.divIcon({
          className: '',
          html: `
            <div class="map-stop-pill">
              <span class="map-stop-badge">${stop.stop_number}</span>
              <span>$${stop.fuel_price_per_gallon.toFixed(2)}</span>
            </div>
          `,
          iconSize: [84, 28],
          iconAnchor: [42, 14]
        });

        const stopMarker = L.marker([stop.latitude, stop.longitude], { icon: icon }).addTo(markersLayer);
        stopMarker.bindPopup(`
          <div style="font-size: 12px; font-family: var(--font-stack);">
            <div style="font-size: 10px; text-transform: uppercase; font-weight: 700; color: #f59e0b; margin-bottom: 2px;">
              Fuel Stop #${stop.stop_number} &bull; Mile ${stop.route_mile}
            </div>
            <strong style="font-size: 13px; color: #ffffff;">${stop.station_name}</strong>
            <div style="color: #a1a1aa; font-size: 11px; margin-top: 2px;">
              ${stop.address}<br>${stop.city}, ${stop.state}
            </div>
            <div style="border-top: 1px solid rgba(255,255,255,0.1); margin: 8px 0; padding-top: 6px;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                <span style="color: #a1a1aa;">Price:</span>
                <strong style="color: #fbbf24;">$${stop.fuel_price_per_gallon.toFixed(3)}/gal</strong>
              </div>
              <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                <span style="color: #a1a1aa;">Refueled:</span>
                <span style="color: #ffffff;">${stop.gallons_refueled} gal</span>
              </div>
              <div style="display: flex; justify-content: space-between;">
                <span style="color: #a1a1aa;">Leg Cost:</span>
                <strong style="color: #ffffff;">$${stop.leg_fuel_cost_usd.toFixed(2)}</strong>
              </div>
            </div>
          </div>
        `);
      });
    }

    // Auto-load initial route
    window.addEventListener('DOMContentLoaded', () => {
      fetchRoute();
    });
  </script>
</body>
</html>
